{% extends "base.html" %}
{% block title %}My Classes{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold mb-4"><i class="fas fa-chalkboard me-2"></i>My Classes</h2>
    <div class="row g-4">
        {% for class_obj in classes %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ class_obj.name }}</h5>
                    <p class="card-text text-muted">Students: {{ class_obj.students|length }}</p>
                    <a href="{{ url_for('teacher_bp.class_view', class_id=class_obj.id) }}" class="btn btn-primary">View Class</a>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12"><div class="alert alert-info">You are not assigned to any class.</div></div>
        {% endfor %}
    </div>
</div>
{% endblock %}
