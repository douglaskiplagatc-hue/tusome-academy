{% extends "base.html" %}
{% block title %}Credit Note{% endblock %}
{% block content %}
    <div class="container">
        <h4>Apply Credit Note</h4>
        <p>
            <strong>Student:</strong> {{ student.full_name }}
        </p>
        <form method="post">
            <div class="mb-3">
                <label>Amount (KES)</label>
                <input type="number" step="0.01" name="amount" required class="form-control">
            </div>
            <div class="mb-3">
                <label>Reason</label>
                <input type="text" name="reason" required class="form-control">
            </div>
            <div class="mb-3">
                <label>Source</label>
                <select name="source" class="form-control">
                    <option value="BURSARY">Bursary</option>
                    <option value="WAIVER">Fee Waiver</option>
                    <option value="ADJUSTMENT">Adjustment</option>
                </select>
            </div>
            <button class="btn btn-success">Apply Credit</button>
            <a href="{{ url_for('fee_bp.admin_view_student_fees', student_id=student.id) }}"
               class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
